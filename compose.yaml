services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: civicos
      POSTGRES_PASSWORD: civicos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicos -d civicos"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - civicos_postgres_data:/var/lib/postgresql/data
      - ./packages/db/docker/init/99-create-civicos.sql:/docker-entrypoint-initdb.d/99-create-civicos.sql:ro

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: civicos-local
      MINIO_ROOT_PASSWORD: civicos-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - civicos_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 civicos-local civicos-local-secret;
      mc mb --ignore-existing local/civicos-images;
      mc anonymous set download local/civicos-images;
      "

volumes:
  civicos_postgres_data:
  civicos_minio_data:

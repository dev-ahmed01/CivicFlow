name: Build City Connect Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/config/**"
      - ".github/workflows/android-demo-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://city-connect-backend-ln7h.onrender.com
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm run build:mobile:deps

      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build installable release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/City-Connect-SIH.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: City-Connect-SIH-Android
          path: artifacts/City-Connect-SIH.apk
          if-no-files-found: error
          retention-days: 14

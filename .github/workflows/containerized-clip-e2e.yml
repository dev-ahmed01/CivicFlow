name: Containerized CLIP E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/containerized-clip-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clip-e2e:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    timeout-minutes: 12
    env:
      CLIP_URL: https://city-connect-clip-stable.onrender.com
      API_URL: https://city-connect-backend-ln7h.onrender.com
      ROAD_CATEGORY_ID: 30000000-0000-4000-8000-000000000001

    steps:
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl jq ca-certificates

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          for url in "$API_URL/health" "$CLIP_URL/health"; do
            ok=0
            for i in $(seq 1 30); do
              body="$(curl --silent --show-error --max-time 20 "$url" || true)"
              echo "$url -> $body"
              if printf '%s' "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" -eq 1
          done

      - name: Accept real pothole photo
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URL="https://raw.githubusercontent.com/dev-ahmed01/CivicFlow/main/packages/db/demo/road-scans/real_sample_01.jpg"
          started="$(date +%s%3N)"
          body="$(curl --fail --silent --show-error --max-time 30             -H 'Content-Type: application/json'             -d "{\"imageUrl\":\"$IMAGE_URL\",\"categoryId\":\"$ROAD_CATEGORY_ID\"}"             "$CLIP_URL/infer")"
          ended="$(date +%s%3N)"
          elapsed="$((ended-started))"
          printf '%s' "$body" | jq '{score,pass,reason,model,processingMs}'
          echo "wall latency ms: $elapsed"
          printf '%s' "$body" | jq -e '.pass == true and .reason == "MATCH"' >/dev/null
          test "$elapsed" -lt 15000

      - name: Reject obvious UI screenshot
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URL="https://raw.githubusercontent.com/dev-ahmed01/CivicFlow/main/docs/project-head-redesign/today-1440.png"
          body="$(curl --fail --silent --show-error --max-time 30             -H 'Content-Type: application/json'             -d "{\"imageUrl\":\"$IMAGE_URL\",\"categoryId\":\"$ROAD_CATEGORY_ID\"}"             "$CLIP_URL/infer")"
          printf '%s' "$body" | jq '{score,pass,reason,model,processingMs}'
          printf '%s' "$body" | jq -e '.pass == false' >/dev/null

name: City Connect Hosted Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hosted-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://city-connect-backend-ln7h.onrender.com
      WEB_BASE: https://city-connect-web.onrender.com

    steps:
      - name: Check canonical backend health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            "$API_BASE/health" -o /tmp/city-connect-health.json
          node -e "if (require('/tmp/city-connect-health.json').status !== 'ok') process.exit(1)"

      - name: Check database-backed public dashboard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            "$API_BASE/analytics/public-dashboard" -o /tmp/city-connect-dashboard.json
          node -e "const d=require('/tmp/city-connect-dashboard.json'); if (!Number.isFinite(d?.totals?.ticketsCreated) || d.totals.ticketsCreated < 1) process.exit(1)"

      - name: Check laptop web application
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            "$WEB_BASE/" -o /tmp/city-connect-web.html
          test -s /tmp/city-connect-web.html
          grep -Eiq 'City Connect|CityConnect' /tmp/city-connect-web.html

      - name: Check web-to-API CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            -X OPTIONS \
            -H "Origin: $WEB_BASE" \
            -H 'Access-Control-Request-Method: GET' \
            -D "$headers" -o /dev/null \
            "$API_BASE/agencies"
          tr -d '\r' < "$headers" | grep -Fi "access-control-allow-origin: $WEB_BASE"

      - name: Verify unauthenticated protected endpoints remain blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --show-error --silent --location \
            --retry 4 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            -o /tmp/protected-response -w '%{http_code}' \
            "$API_BASE/protected/me")"
          test "$code" = "401"

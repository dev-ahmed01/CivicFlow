name: City Connect Hosted Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hosted-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check canonical backend health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location             --retry 8 --retry-delay 10 --retry-all-errors             --max-time 90             https://city-connect-backend-ln7h.onrender.com/health | tee /tmp/health.json

      - name: Check legacy API compatibility endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location             --retry 8 --retry-delay 10 --retry-all-errors             --max-time 90             https://city-connect-api-wi71.onrender.com/health | tee /tmp/legacy-health.json

      - name: Check web deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location             --retry 5 --retry-delay 5 --retry-all-errors             --max-time 60             --output /tmp/city-connect-web.html             https://city-connect-web-jet.vercel.app/
          test -s /tmp/city-connect-web.html

      - name: Check production CORS
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --show-error --silent             --retry 5 --retry-delay 5 --retry-all-errors             --max-time 60             -X OPTIONS             -H 'Origin: https://city-connect-web-jet.vercel.app'             -H 'Access-Control-Request-Method: GET'             -D "$headers"             -o /dev/null             https://city-connect-backend-ln7h.onrender.com/agencies
          tr -d '\r' < "$headers" | grep -i '^access-control-allow-origin: https://city-connect-web-jet.vercel.app$'

name: API Auth Performance CI

on:
  push:
    branches: [main, fix/mobile-session-otp-20261122]
    paths:
      - ".github/workflows/api-auth-perf-ci.yml"
      - "apps/api/src/auth/**"
      - "apps/api/src/app.ts"
      - "apps/api/src/app.test.ts"
      - "apps/api/src/config/**"
      - "apps/mobile/**"
      - "packages/shared/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API and workspace dependencies
        run: pnpm --filter api... build
      - name: Run auth tests
        run: pnpm --filter api exec vitest run src/app.test.ts src/auth/routes.test.ts src/auth/otp-service.test.ts src/auth/otp-provider.test.ts src/config/env.test.ts
      - name: Validate shared OTP schema
        run: pnpm --filter @civicos/shared test

      - name: Validate Android session recovery and phone login
        env:
          EXPO_PUBLIC_API_URL: https://city-connect-backend-ln7h.onrender.com
          EXPO_PUBLIC_DEMO_OTP: "true"
        run: |
          pnpm --filter mobile build
          EXPO_PUBLIC_API_URL=http://10.0.2.2:4000 EXPO_PUBLIC_ALLOW_LOCAL_API=true pnpm --filter mobile test

      - name: Build laptop web portal with citizen guest entry
        env:
          NEXT_PUBLIC_API_URL: https://city-connect-backend-ln7h.onrender.com
          NEXT_PUBLIC_ENABLE_GUEST_DEMO: "true"
        run: pnpm --filter web... build

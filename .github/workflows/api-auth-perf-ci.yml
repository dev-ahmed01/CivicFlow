name: API Auth Performance CI

on:
  push:
    branches: [main, fix/cityconnect-render-recovery-20261122]
    paths:
      - ".github/workflows/api-auth-perf-ci.yml"
      - "apps/api/src/auth/**"
      - "apps/api/src/app.ts"
      - "apps/api/src/app.test.ts"
      - "apps/api/src/config/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API and workspace dependencies
        run: pnpm --filter api... build
      - name: Run auth tests
        run: pnpm --filter api exec vitest run src/app.test.ts src/auth/routes.test.ts src/auth/otp-service.test.ts src/auth/otp-provider.test.ts

name: Export CivicFlow Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf /tmp/CivicFlow-source.tar.gz . && mv /tmp/CivicFlow-source.tar.gz CivicFlow-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: CivicFlow-source
          path: CivicFlow-source.tar.gz
          retention-days: 1

services:
  - type: web
    name: civicos-api-free-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    # Render pre-deploy commands require a paid instance. The seed is idempotent,
    # so the free profile safely migrates and restores showcase data at startup.
    dockerCommand: sh -c "corepack pnpm --filter db exec prisma migrate deploy && corepack pnpm --filter db exec prisma db seed && exec pnpm --filter api start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_PROFILE
        value: free_demo
      # Supabase Supavisor session-mode URL (port 5432); Prisma remains unchanged.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: DEMO_INTERNAL_PASSWORD
        sync: false
      - key: OTP_PROVIDER
        value: demo
      - key: OTP_TTL_MINUTES
        value: 10
      - key: DEMO_AUTH_MODE
        value: fixed_otp
      - key: DEMO_AUTH_CODE
        sync: false
      - key: DEMO_NOTIFY_ALL_CITIZENS
        value: true
      # Cloudflare R2 uses the existing S3-compatible signer.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # Keyless, local quantized CLIP inference; no paid inference account.
      - key: CLIP_MODE
        value: local_clip
      - key: CLIP_LOCAL_MODEL
        value: Xenova/clip-vit-base-patch32
      - key: CLIP_TIMEOUT_MS
        value: 8000
      - key: DEMO_SEED_MODE
        value: if_empty
      - key: CORS_ORIGINS
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: VALIDATION_REBATCH_POLL_MINUTES
        value: 15
      - key: DEPENDENCY_ESCALATION_POLL_MINUTES
        value: 15
      - key: PUSH_DELIVERY_POLL_SECONDS
        value: 15

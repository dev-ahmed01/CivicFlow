# Focused recovery Blueprint for the existing Render backend.
# Does not create, delete, or replace a PostgreSQL database.
# Existing service env vars not declared below must remain intact.
services:
  - type: web
    name: city-connect-backend
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/dev-ahmed01/CivicFlow
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter api... build
    startCommand: pnpm --filter db exec prisma migrate deploy && pnpm --filter api start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: city-connect-postgres-recovered
          property: connectionString

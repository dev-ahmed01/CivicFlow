# Existing CityConnect backend recovery configuration.
# Render links DATABASE_URL to the existing recovered database without exposing its password.
# Other service environment variables remain unchanged on sync.
services:
  - type: web
    name: city-connect-backend
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/dev-ahmed01/CivicFlow
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter api... build
    # Demo seed was applied once through a guarded recovery sync.
    # Keep normal startup short and never reset or seed on each cold start.
    startCommand: pnpm --filter db exec prisma migrate deploy && pnpm --filter api start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: city-connect-postgres-recovered
          property: connectionString

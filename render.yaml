services:
  - type: web
    name: civicos-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    preDeployCommand: corepack pnpm --filter db exec prisma migrate deploy
    initialDeployHook: corepack pnpm --filter db exec prisma db seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_PROFILE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicos-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: DEMO_INTERNAL_PASSWORD
        sync: false
      - key: OTP_PROVIDER
        value: twilio
      - key: DEMO_AUTH_MODE
        value: disabled
      - key: OTP_TTL_MINUTES
        value: 10
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: CLIP_INFERENCE_URL
        sync: false
      - key: CLIP_INFERENCE_TOKEN
        sync: false
      - key: CLIP_MODE
        value: hosted
      - key: CLIP_TIMEOUT_MS
        value: 8000
      - key: CORS_ORIGINS
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: VALIDATION_REBATCH_POLL_MINUTES
        value: 15
      - key: DEPENDENCY_ESCALATION_POLL_MINUTES
        value: 15
      - key: PUSH_DELIVERY_POLL_SECONDS
        value: 15

databases:
  - name: civicos-postgres
    databaseName: civicos
    user: civicos
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
